# Copy over .github/workflows/build.yml on GitHub if git push is rejected
# (the token has no `workflows` permission).
name: Build Overlay.dylib

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build:
    name: Build iOS Dylib
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "${newest}" ]; then
              echo "ERROR: no Xcode.app found"
              ls /Applications || true
              exit 1
            fi
            sudo xcode-select -s "${newest}/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Check sources
        run: python3 scripts/check_objc.py
      - name: Build
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          make clean
          make
          test -s Overlay.dylib
          echo "=== Derleme Sonucu ==="
          ls -lh Overlay.dylib
          lipo -info Overlay.dylib
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Overlay.dylib
          path: Overlay.dylib
          if-no-files-found: error
          retention-days: 90
