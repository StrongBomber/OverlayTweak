# ==============================================================================
# GitHub Actions - OverlayTweak Build
# ==============================================================================
# Xcode ve iOS SDK doğru şekilde yapılandırılır.
# ==============================================================================

name: Build Overlay.dylib

on:
  workflow_dispatch:  # Manuel tetikleme

jobs:
  build:
    name: Build iOS Dylib
    runs-on: macos-15  # macOS 15 (Sequoia) - Xcode 16 ile gelir

    steps:
      # 1. Repository'yi klonla
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Xcode'u ayarla
      - name: Setup Xcode
        run: |
          # Mevcut Xcode sürümünü göster
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo ""
          # iOS SDK yolunu göster
          xcrun --sdk iphoneos --show-sdk-path
          echo ""
          # Xcode lisansını kabul et
          sudo xcodebuild -license accept 2>/dev/null || true

      # 3. Derle
      - name: Build
        run: |
          make clean
          make
          echo ""
          echo "=== Derleme Sonucu ==="
          ls -lh Overlay.dylib
          file Overlay.dylib
          lipo -info Overlay.dylib

      # 4. Artifact olarak yükle
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Overlay.dylib
          path: Overlay.dylib
          retention-days: 90
