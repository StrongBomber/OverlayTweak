# Copy to .github/workflows/build.yml if the GitHub App cannot update workflows.
name: Build Overlay.dylib

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Dylib
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)/Contents/Developer"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - run: python3 scripts/check_objc.py
      - name: Build
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          make clean && make
          test -f Overlay.dylib
          lipo -info Overlay.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: Overlay.dylib
          path: Overlay.dylib
          if-no-files-found: error
          retention-days: 90
